<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#f7f8fc" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="共通語を日本各地の方言に変換" />
    <title>Namari</title>
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <style>
      /* JS 読み込み前に必要な最小スタイル（検索バー＋全画面スケルトン） */
      :root {
        --bg: #f7f8fc;
        --ink: #14161f;
        --ink-2: #5a5f73;
        --hair: rgba(20, 22, 31, 0.08);
        --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.5));
        --glass-edge: rgba(255, 255, 255, 0.85);
        --shadow: 0 10px 30px rgba(40, 52, 120, 0.1), 0 1px 2px rgba(20, 22, 31, 0.05);
        --font: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP',
          'Noto Sans CJK JP', 'Yu Gothic UI', 'Meiryo', system-ui, sans-serif;
        --top-safe: env(safe-area-inset-top, 0px);
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); -webkit-text-size-adjust: 100%; }
      body { min-height: 100dvh; overflow-x: hidden; }
      .topbar {
        position: fixed; z-index: 40; top: 0; left: 0; right: 0;
        padding: calc(var(--top-safe) + 10px) 16px 10px;
        display: flex; justify-content: center; pointer-events: none;
      }
      .topbar-inner { width: 100%; max-width: 528px; display: flex; gap: 10px; align-items: center; pointer-events: auto; }
      .searchbox {
        position: relative; flex: 1; height: 50px; border-radius: 25px;
        background: var(--glass); border: 1px solid var(--glass-edge);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.95), var(--shadow);
        -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
        display: flex; align-items: center;
      }
      .searchbox svg { position: absolute; left: 17px; width: 19px; height: 19px; color: var(--ink-2); pointer-events: none; }
      .searchbox input {
        width: 100%; height: 100%; border: 0; outline: 0; background: transparent;
        padding: 0 44px 0 46px; font: 500 17px/1 var(--font); color: var(--ink); border-radius: 25px;
        -webkit-appearance: none; appearance: none;
      }
      .searchbox input::placeholder { color: #8b90a3; }
      .avatar-btn {
        width: 50px; height: 50px; border-radius: 25px; flex: none;
        background: var(--glass); border: 1px solid var(--glass-edge); box-shadow: var(--shadow);
        -webkit-backdrop-filter: blur(22px) saturate(180%); backdrop-filter: blur(22px) saturate(180%);
      }
      #boot {
        position: fixed; inset: 0; z-index: 30; background: var(--bg);
        padding: calc(var(--top-safe) + 76px) 16px 0; display: flex; justify-content: center;
        transition: opacity 0.45s ease, filter 0.45s ease;
      }
      #boot.leaving { opacity: 0; filter: blur(6px); pointer-events: none; }
      #boot .col { width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 14px; }
      .sk {
        border-radius: 22px; background: #eceef5; position: relative; overflow: hidden;
      }
      .sk::after {
        content: ''; position: absolute; inset: 0;
        background: linear-gradient(100deg, transparent 20%, rgba(255, 255, 255, 0.85) 50%, transparent 80%);
        transform: translateX(-100%); animation: sk 1.3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .sk.r { display: flex; gap: 8px; background: none; overflow: visible; }
      .sk.r::after { display: none; }
      .sk.r > i { flex: none; width: 76px; height: 36px; border-radius: 18px; background: #eceef5; }
      .sk-tab { position: fixed; left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); width: min(340px, calc(100% - 40px)); height: 66px; border-radius: 33px; }
      @keyframes sk { to { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) { .sk::after { animation: none; } }
    </style>
    <script type="module" crossorigin src="./assets/main-xg_PzcMb.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/preload-helper-Du-ZIQLl.js">
    <link rel="modulepreload" crossorigin href="./assets/tokenizer-2esH2ihD.js">
    <link rel="stylesheet" crossorigin href="./assets/main-BQXIO0LD.css">
  </head>
  <body>
    <header class="topbar" id="shell-top">
      <div class="topbar-inner">
        <label class="searchbox">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="shell-q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="方言を検索" aria-label="方言・フレーズを検索" autofocus />
        </label>
        <a class="avatar-btn map-link" href="map/" aria-label="地図で見る" data-testid="map-link"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg></a>
      </div>
    </header>
    <div id="boot" aria-busy="true" aria-label="読み込み中">
      <div class="col">
        <div class="sk r"><i></i><i></i><i></i><i></i></div>
        <div class="sk" style="height: 84px"></div>
        <div class="sk" style="height: 168px"></div>
        <div class="sk" style="height: 54px; border-radius: 27px"></div>
        <div class="sk" style="height: 120px"></div>
        <div class="sk sk-tab"></div>
      </div>
    </div>
    <div id="app"></div>
  </body>
</html>
