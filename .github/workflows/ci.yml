name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER_SEND_METRICS: 'false'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 型チェック・単体テスト・ビルド・E2E（実ブラウザ）
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
    steps:
      - name: Cloudflare の設定を確認
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップします（README の「デプロイ」参照）"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.check.outputs.enabled == 'true'
        run: npm ci
      - name: D1 を用意
        if: steps.check.outputs.enabled == 'true'
        run: node scripts/prepare-deploy.mjs
      - name: D1 マイグレーション
        if: steps.check.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply DB --remote
      - name: ビルドしてデプロイ
        if: steps.check.outputs.enabled == 'true'
        run: |
          npm run build
          ARGS=()
          if [ -n "$GOOGLE_CLIENT_ID" ]; then ARGS+=(--var "GOOGLE_CLIENT_ID:${GOOGLE_CLIENT_ID}"); fi
          npx wrangler deploy "${ARGS[@]}"
      - name: セッション鍵を設定
        if: steps.check.outputs.enabled == 'true'
        run: node scripts/ensure-secret.mjs
